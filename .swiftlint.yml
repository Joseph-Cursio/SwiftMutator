trailing_comma:
  mandatory_comma: true

# Only a lone closure without a label must trail. One with a label keeps it, since the label says what the closure is
# for (`uniquingKeysWith:`, `by:`), and the fix SwiftLint makes to a call over several lines leaves it misformatted.
trailing_closure:
  only_single_muted_parameter: true

# Years are written as years: `2021`, not `2_021`.
number_separator:
  exclude_ranges:
    - min: 2010.0
      max: 2030.0

# Run only by `swiftlint analyze`, which needs a verbose build's compiler log; CI doesn't run it yet. explicit_self is
# left out: it wants the `self.` that redundant_self, above, removes.
analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

# The size and complexity rules' limits are set just above the longest the code has, where the defaults would have it
# split code that reads well whole: a report's long switch, a test class with a test for each case. Each stops the
# code from growing past what it is.

# Most code wraps at 120 columns. A multiline string is left as it is: the HTML report's SVG icons, and the sources and
# logs the tests read, which would change if wrapped.
line_length:
  warning: 120
  ignores_multiline_strings: true
  ignores_urls: true

function_body_length: 150

type_body_length: 1100

# Comments don't count: the code explains itself at length.
file_length:
  warning: 1100
  ignore_comment_only_lines: true

# A switch over every event or every kind of syntax is one decision, however many cases it has.
cyclomatic_complexity:
  warning: 12
  ignores_case_statements: true

function_parameter_count: 6

# A table of test cases is an array of labelled tuples, a member for each column.
large_tuple: 5

# A type's own kinds of thing (an error's reasons, a report's rows) nest in it, and so on down a level.
nesting:
  type_level: 2
