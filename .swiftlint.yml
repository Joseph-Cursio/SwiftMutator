excluded:
  - .build

included:
  - Sources
  - Tests

# If true, SwiftLint will treat all warnings as errors.
strict: true

# The rules the code passes, of the full set chosen in SwiftLint Rule Studio. Each other rule joins once its
# violations are fixed.
only_rules:
  - trailing_comma
  - vertical_whitespace
  - literal_expression_end_indentation
  - non_overridable_class_declaration
  - superfluous_disable_command
  - protocol_property_accessors_order
  - duplicate_enum_cases
  - deployment_target
  - period_spacing
  - array_init
  - inclusive_language
  - legacy_hashing
  - syntactic_sugar
  - colon
  - duplicate_imports
  - collection_alignment
  - duplicated_key_in_dictionary_literal
  - nimble_operator
  - notification_center_detachment
  - invalid_swiftlint_command
  - object_literal
  - prefer_asset_symbols
  - prefer_zero_over_explicit_init
  - quick_discouraged_call
  - custom_rules
  - unneeded_parentheses_in_closure_argument
  - multiple_closures_with_trailing_closure
  - control_statement
  - void_return
  - self_binding
  - unneeded_break_in_switch
  - static_over_final_class
  - empty_enum_arguments
  - legacy_cggeometry_functions
  - private_subject
  - nslocalizedstring_require_bundle
  - nsobject_prefer_isequal
  - orphaned_doc_comment
  - ns_number_init_as_function_reference
  - first_where
  - private_over_fileprivate
  - is_disjoint
  - trailing_semicolon
  - contains_over_filter_is_empty
  - comma_inheritance
  - multiline_parameters
  - private_swiftui_state
  - empty_parameters
  - empty_string
  - redundant_discardable_let
  - closure_spacing
  - void_function_in_ternary
  - quick_discouraged_pending_test
  - overridden_super_call
  - private_action
  - unavailable_condition
  - accessibility_trait_for_button
  - closing_brace
  - redundant_sendable
  - redundant_final
  - block_based_kvo
  - last_where
  - prohibited_super_call
  - unused_enumerated
  - legacy_constructor
  - explicit_init
  - closure_end_indentation
  - prohibited_interface_builder
  - redundant_type_annotation
  - redundant_void_return
  - unused_control_flow_label
  - dynamic_inline
  - compiler_protocol_init
  - nslocalizedstring_key
  - redundant_string_enum_value
  - required_enum_case
  - shorthand_optional_binding
  - yoda_condition
  - empty_parentheses_with_trailing_closure
  - local_doc_comment
  - strong_iboutlet
  - closure_parameter_position
  - prefer_self_type_over_type_of_self
  - blanket_disable_command
  - contains_over_range_nil_comparison
  - mark
  - prefer_type_checking
  - untyped_error_in_catch
  - valid_ibinspectable
  - no_space_in_method_call
  - quick_discouraged_focused_test
  - legacy_multiple
  - private_unit_test
  - enum_case_associated_values_count
  - discouraged_object_literal
  - empty_collection_literal
  - discouraged_direct_init
  - modifier_order
  - reduce_boolean
  - return_arrow_whitespace
  - redundant_objc_attribute
  - unused_closure_parameter
  - fatal_error_message
  - leading_whitespace
  - override_in_extension
  - discouraged_assert
  - redundant_nil_coalescing
  - extension_access_modifier
  - pattern_matching_keywords
  - self_in_property_initialization
  - no_fallthrough_only
  - convenience_type
  - duplicate_conditions
  - generic_type_name
  - legacy_nsgeometry_functions
  - sorted_imports
  - multiline_literal_brackets
  - redundant_set_access_control
  - incompatible_concurrency_annotation
  - legacy_swiftui_aspect_ratio
  - fallthrough
  - opening_brace
  - unhandled_throwing_task
  - legacy_uigraphics_function
  - legacy_random
  - switch_case_alignment
  - multiline_arguments_brackets
  - toggle_bool
  - shorthand_operator
  - xctfail_message
  - contains_over_filter_count
  - ibinspectable_in_extension
  - implicit_getter
  - accessibility_label_for_image
  - attribute_name_spacing
  - invisible_character
  - function_name_whitespace
  - private_outlet
  - legacy_constant
  - expiring_todo
  - multiline_parameters_brackets
  - vertical_parameter_alignment

trailing_comma:
  mandatory_comma: true
