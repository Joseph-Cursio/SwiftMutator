excluded:
  - .build
  - Tests/fixtures

included:
  - Sources
  - Tests

# If true, SwiftLint will treat all warnings as errors.
strict: true

# The rules the code passes, of the full set chosen in SwiftLint Rule Studio. Each other rule joins once its
# violations are fixed.
#
# Left out on purpose: optional_data_string_conversion, which would replace String(decoding:as:) with the failable
# String(bytes:encoding:). The code decodes test output, logs and source it didn't write, where a byte that isn't
# UTF-8 should become U+FFFD, not cost the whole text.
only_rules:
  - trailing_comma
  - vertical_whitespace
  - literal_expression_end_indentation
  - non_overridable_class_declaration
  - superfluous_disable_command
