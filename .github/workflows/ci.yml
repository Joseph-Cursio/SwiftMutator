# Builds SwiftMutator and runs the unit suite (the muterTests target).
# The acceptance and regression targets are compiled but not run here: they
# need sample projects generated by AcceptanceTests/runAcceptanceTests.sh and
# RegressionTests/runRegressionTests.sh (and an iOS simulator for acceptance).
# regression-tests.yml runs the regression tests once a day.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a newer push cancels the older run.
  # Every other run (push to main, manual dispatch) gets a group of its own, so
  # no merge commit's run is cancelled or replaced by a later one.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail, so `| tee` keeps the exit status

jobs:
  unit-tests:
    # main's ruleset requires these jobs, and SwiftLint, by name: change it with a runner or Xcode.
    name: Unit tests (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # GA image, one release behind the local Macs (Swift 6.3, macOS 26),
          # to catch code that only the newest toolchain accepts or type-checks in time.
          - runner: macos-26
            xcode: '26.6'
          # Preview image (no SLA, may queue). Swift 6.4, the same Xcode build as
          # the local Macs, built from a clean checkout.
          - runner: xcode-27
            xcode: '27.0'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        id: toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Installed Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sw_vers
          xcodebuild -version
          swift --version
          echo "swift: $(command -v swift)"
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          echo "Toolchain: $(xcodebuild -version | paste -sd ' ' -); $(swift --version 2>&1 | head -n 1)" >> "$GITHUB_STEP_SUMMARY"
          # For the cache key: modules built by another compiler build can't be imported, and an image update
          # can change the build behind the same Xcode folder.
          toolchain=$({ xcodebuild -version; swift --version 2>&1; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256)
          echo "hash=${toolchain:0:16}" >> "$GITHUB_OUTPUT"

      # .build as the last push to main left it, for the same toolchain and Package.resolved, so the dependencies
      # aren't fetched and built again. Checking out gives every file this run's time, so SwiftMutator's own modules
      # build again anyway. Pull requests only restore it: a cache saved by a pull request is visible to that pull
      # request alone, and would push main's out of the repository's cache storage.
      - name: Restore .build
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: build-${{ matrix.runner }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}

      - name: Resolve dependencies from Package.resolved
        run: swift package resolve --force-resolved-versions

      - name: Build package and tests
        timeout-minutes: 20
        run: swift build --build-tests --force-resolved-versions 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Before the tests, so that a failing test doesn't stop it, and .build holds only what the build wrote.
      - name: Save .build
        if: github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Run unit tests (muterTests)
        timeout-minutes: 20
        env:
          SNAPSHOT_TESTING_RECORD: never
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: swift test --force-resolved-versions --filter '^muterTests\.' 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Check that the unit suite ran
        run: |
          # swift test exits 0, with only a warning, when --filter matches nothing.
          executed=$(grep -oE 'Executed [0-9]+ tests?' "$RUNNER_TEMP/test.log" | awk '{print $2}' | sort -n | tail -n 1 || true)
          echo "XCTest tests executed: ${executed:-0}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${executed:-0}" -eq 0 ]; then
            echo "::error::No unit tests ran. Check that --filter '^muterTests\.' still matches the test target."
            exit 1
          fi

      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Errors and failed tests'
            echo '```text'
            grep -h -E 'error:|Test Case .* failed|with [1-9][0-9]* failures?' \
              "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log" 2>/dev/null \
              | sed "s|$GITHUB_WORKSPACE/||g" | head -n 200 || true
            echo '```'
            echo "Full logs and any mismatched snapshots are attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and mismatched snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-failure-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/snapshot-failures/
          if-no-files-found: ignore
          retention-days: 14

  # Lints the paths in .swiftlint.yml with the shared rules it points at (`parent_config:
  # ../SwiftLintConfig/.swiftlint.yml`, from github.com/Joseph-Cursio/SwiftLintConfig), so this repo and the
  # shared config are checked out side by side. --strict: a warning fails the job.
  # SwiftLint's own image, its version pinned, so that CI and a Mac with the same version find the same violations.
  # On Linux: no Swift build is needed, and the job starts at once.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SwiftMutator
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: SwiftMutator
          persist-credentials: false

      - name: Check out the shared SwiftLint config
        uses: actions/checkout@v7
        with:
          repository: Joseph-Cursio/SwiftLintConfig
          path: SwiftLintConfig
          persist-credentials: false

      - name: Lint
        # Each violation is also shown as an annotation on the pull request's files.
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

  # The shared config's analyzer_rules, which `swiftlint lint` never runs: they need the types a compiler log gives,
  # so this builds on macOS, on the unit-tests job's xcode-27 runner and Xcode 27.0 (a Mac on a later 27.x can find a
  # little more or less). Any finding fails it. Not one of the jobs main's ruleset requires.
  #
  # Each rule type-checks every file it looks at through SourceKit, one after another. unused_import over every file
  # takes 45 minutes or more, so on a pull request it looks only at the Swift files the pull request changes, where an
  # unused import comes from; a push to main, or a run by hand, looks at every file, in parallel processes. The other
  # rules always look at every file: capture_variable and unused_declaration collect across files.
  swiftlint-analyze:
    name: SwiftLint analyzer
    runs-on: xcode-27
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 150 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SWIFTLINT_VERSION: 0.65.1
      # portable_swiftlint.zip's SHA-256, as the release lists it.
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      # At the workspace's root, as the unit-tests job checks out, so that .build is the same cache path. Two commits
      # deep, so that a pull request's merge commit has its base, HEAD^1, to compare with.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # .swiftlint.yml's parent_config is ../SwiftLintConfig/.swiftlint.yml, outside the workspace, where a checkout
      # can't go: it is checked out inside, and linked there.
      - name: Check out the shared SwiftLint config
        uses: actions/checkout@v7
        with:
          repository: Joseph-Cursio/SwiftLintConfig
          path: .shared-swiftlint-config
          persist-credentials: false

      - name: Link the shared SwiftLint config
        run: ln -s "$GITHUB_WORKSPACE/.shared-swiftlint-config" ../SwiftLintConfig

      # The same version as the SwiftLint job's container, whatever the image has installed.
      - name: Install SwiftLint
        run: |
          zip="$RUNNER_TEMP/portable_swiftlint.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $zip" | shasum -a 256 -c -
          unzip -q -o "$zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      # As the unit-tests job computes it, so that the cache key is the same.
      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          toolchain=$({ xcodebuild -version; swift --version 2>&1; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256)
          echo "hash=${toolchain:0:16}" >> "$GITHUB_OUTPUT"

      # The unit-tests job's .build, only restored: that job saves it on pushes to main. The dependencies are then
      # built already, and SwiftMutator's own modules build again, which puts their compile commands in the log.
      - name: Restore .build
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: build-xcode-27-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved') }}

      - name: Build with a compiler log
        timeout-minutes: 30
        run: |
          swift package resolve --force-resolved-versions
          swift build --build-tests -v --force-resolved-versions > "$RUNNER_TEMP/compile.log" 2>&1 \
            || { tail -n 50 "$RUNNER_TEMP/compile.log"; exit 1; }

      # Every rule in the shared config's analyzer_rules, each run on its own, as SwiftLint 0.65.1 crashes running
      # several in one invocation. The script fails unless SwiftLint analyzed every file it was given.
      - name: Analyze
        env:
          SWIFTLINT_REPORTER: github-actions-logging
        run: |
          swiftlint version
          rules=$(awk '/^analyzer_rules:/ { f = 1; next } f && /^  - / { print $2; next } f { f = 0 }' \
            ../SwiftLintConfig/.swiftlint.yml)
          if [ -z "$rules" ]; then
            echo "::error::No analyzer_rules found in ../SwiftLintConfig/.swiftlint.yml."
            exit 1
          fi
          # unused_import looks at one file at a time, so its files are shared between processes: a pull request that
          # changes most files, as a formatting sweep does, would otherwise outlast the timeout.
          cpus=$(sysctl -n hw.ncpu)
          jobs=$((cpus < 4 ? cpus : 4))
          status=0
          for rule in $rules; do
            echo "::group::$rule"
            if [ "$rule" != unused_import ]; then
              Scripts/ci-swiftlint-analyze.sh "$RUNNER_TEMP/compile.log" "$rule" all || status=1
            elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              Scripts/ci-swiftlint-analyze.sh "$RUNNER_TEMP/compile.log" "$rule" changed-since HEAD^1 --jobs "$jobs" \
                || status=1
            else
              Scripts/ci-swiftlint-analyze.sh "$RUNNER_TEMP/compile.log" "$rule" all --jobs "$jobs" || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # Non-blocking (continue-on-error): SwiftMutator builds on Linux and its unit
  # suite runs, but it hasn't passed here long enough to block a merge. It shows
  # what fails on Linux without failing the workflow. Not on pull
  # requests, where a failure every PR shares would hide one of its own: it runs
  # on pushes to main and by hand. #130 tracks making it pass; then run it on
  # pull requests and drop continue-on-error, so it blocks like the macOS job.
  linux-unit-tests:
    name: Unit tests (Linux, Swift 6.4, non-blocking)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The official image: Swift 6.4 on Ubuntu 24.04. With an init as PID 1: Actions
    # starts the container with `tail -f /dev/null` there, which never reaps the
    # orphans a killed test leaves, so the process tests saw them as still running.
    container:
      image: swift:6.4-noble
      options: --init
    timeout-minutes: 45
    continue-on-error: true
    env:
      # A fixed path inside the container, which every step, the upload too, reads.
      LOGS: /tmp/ci-logs
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME"
          swift --version
          echo "swift: $(command -v swift) -> $(readlink -f "$(command -v swift)")"
          echo "llvm-cov: $(command -v llvm-cov || echo 'not on PATH')"
          echo "Toolchain: $PRETTY_NAME; $(swift --version 2>&1 | head -n 1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve dependencies from Package.resolved
        run: swift package resolve --force-resolved-versions

      - name: Build package and tests
        timeout-minutes: 20
        run: |
          mkdir -p "$LOGS"
          swift build --build-tests --force-resolved-versions 2>&1 | tee "$LOGS/build.log"

      - name: Run unit tests (muterTests)
        timeout-minutes: 20
        env:
          SNAPSHOT_TESTING_RECORD: never
          SNAPSHOT_ARTIFACTS: ${{ env.LOGS }}/snapshot-failures
        run: swift test --force-resolved-versions --filter '^muterTests\.' 2>&1 | tee "$LOGS/test.log"

      - name: Check that the unit suite ran
        run: |
          # swift test exits 0, with only a warning, when --filter matches nothing.
          executed=$(grep -oE 'Executed [0-9]+ tests?' "$LOGS/test.log" | awk '{print $2}' | sort -n | tail -n 1 || true)
          echo "XCTest tests executed: ${executed:-0}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${executed:-0}" -eq 0 ]; then
            echo "::error::No unit tests ran. Check that --filter '^muterTests\.' still matches the test target."
            exit 1
          fi

      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Errors and failed tests (Linux, non-blocking)'
            echo '```text'
            grep -h -E 'error:|Test Case .* failed|with [1-9][0-9]* failures?' \
              "$LOGS/build.log" "$LOGS/test.log" 2>/dev/null \
              | sed "s|$GITHUB_WORKSPACE/||g" | head -n 200 || true
            echo '```'
            echo "Full logs and any mismatched snapshots are attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and mismatched snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-failure-linux-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.LOGS }}/build.log
            ${{ env.LOGS }}/test.log
            ${{ env.LOGS }}/snapshot-failures/
          if-no-files-found: ignore
          retention-days: 14
