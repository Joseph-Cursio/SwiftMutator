# Builds SwiftMutator and runs the unit suite (the muterTests target).
# The acceptance and regression targets are compiled but not run here: they
# need sample projects generated by AcceptanceTests/runAcceptanceTests.sh and
# RegressionTests/runRegressionTests.sh (and an iOS simulator for acceptance).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a newer push cancels the older run.
  # Every other run (push to main, manual dispatch) gets a group of its own, so
  # no merge commit's run is cancelled or replaced by a later one.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail, so `| tee` keeps the exit status

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # GA image, one release behind the local Macs (Swift 6.3, macOS 26),
          # to catch code that only the newest toolchain accepts or type-checks in time.
          - runner: macos-26
            xcode: '26.6'
          # Preview image (no SLA, may queue). Swift 6.4, the same Xcode build as
          # the local Macs, built from a clean checkout.
          - runner: xcode-27
            xcode: '27.0'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Installed Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sw_vers
          xcodebuild -version
          swift --version
          echo "swift: $(command -v swift)"
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          echo "Toolchain: $(xcodebuild -version | paste -sd ' ' -); $(swift --version 2>&1 | head -n 1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve dependencies from Package.resolved
        run: swift package resolve --force-resolved-versions

      - name: Build package and tests
        timeout-minutes: 20
        run: swift build --build-tests --force-resolved-versions 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Run unit tests (muterTests)
        timeout-minutes: 20
        env:
          SNAPSHOT_TESTING_RECORD: never
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: swift test --force-resolved-versions --filter '^muterTests\.' 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Check that the unit suite ran
        run: |
          # swift test exits 0, with only a warning, when --filter matches nothing.
          executed=$(grep -oE 'Executed [0-9]+ tests?' "$RUNNER_TEMP/test.log" | awk '{print $2}' | sort -n | tail -n 1 || true)
          echo "XCTest tests executed: ${executed:-0}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${executed:-0}" -eq 0 ]; then
            echo "::error::No unit tests ran. Check that --filter '^muterTests\.' still matches the test target."
            exit 1
          fi

      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Errors and failed tests'
            echo '```text'
            grep -h -E 'error:|Test Case .* failed|with [1-9][0-9]* failures?' \
              "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log" 2>/dev/null \
              | sed "s|$GITHUB_WORKSPACE/||g" | head -n 200 || true
            echo '```'
            echo "Full logs and any mismatched snapshots are attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and mismatched snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-failure-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/snapshot-failures/
          if-no-files-found: ignore
          retention-days: 14
